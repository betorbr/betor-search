name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Go test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: gofmt -w ./... && git diff --exit-code

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -trimpath -ldflags "-s -w" -o betor-search ./cmd/server
